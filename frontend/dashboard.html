<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>SkillUpgrade | Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #f6f7fb;
      --card: #ffffff;
      --text: #333;
      --accent: #8b5cf6;
      --soft: #ede9fe;
    }

    body.dark {
      --bg: #121212;
      --card: #1f1f1f;
      --text: #f5f5f5;
      --accent: #a78bfa;
      --soft: #2b2b2b;
    }

    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .dashboard {
      background: var(--card);
      width: 420px;
      padding: 25px;
      border-radius: 14px;
      box-shadow: 0 15px 30px rgba(0,0,0,0.08);
    }

    h2 {
      text-align: center;
      margin-bottom: 20px;
      color: var(--accent);
    }

    select, input {
      width: 100%;
      padding: 10px;
      margin-bottom: 14px;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 14px;
    }

    button {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 8px;
      background: var(--accent);
      color: white;
      font-size: 15px;
      cursor: pointer;
      margin-bottom: 10px;
    }

    button:hover {
      opacity: 0.9;
    }

    .secondary {
      background: #ef4444;
    }

    .theme-btn {
      background: var(--soft);
      color: var(--text);
      margin-bottom: 15px;
    }

    #result {
      margin-top: 15px;
      background: var(--soft);
      padding: 12px;
      border-radius: 8px;
      font-size: 14px;
    }

    ul {
      padding-left: 18px;
    }

    li {
      margin-bottom: 6px;
    }
  </style>
</head>

<body>

  <div class="dashboard">
    <h2>🎓 SkillUpgrade Dashboard</h2>

    <button class="theme-btn" onclick="toggleTheme()">🌗 Toggle Theme</button>

    <select id="jobDomain" onchange="loadTitles()">
      <option value="">Select Job Domain</option>
    </select>

    <select id="jobTitle">
      <option value="">Select Job Title</option>
    </select>

    <input
      type="text"
      id="skills"
      placeholder="Enter your skills (e.g. Python, SQL, ML)"
    />

    <button onclick="analyzeSkills()">Analyze Skills</button>

    <div id="result"></div>

    <button class="secondary" onclick="logout()">Logout</button>
  </div>

  <script src="dashboard.js"></script>
</body>
</html>
