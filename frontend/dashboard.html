<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | Skillupgrade</title>

    <link rel="stylesheet" href="css/style.css">

    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        .chart-container {
            position: relative;
            margin: auto;
            height: 200px;
            width: 200px;
        }

        #chart-label {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 1.5rem;
            font-weight: 800;
            color: #f72585;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        .skill-tag {
            display: inline-block;
            background: #f0f4f8;
            padding: 5px 12px;
            border-radius: 20px;
            margin: 4px;
            font-size: 0.85rem;
            font-weight: 700;
            color: #3b4d61;
            border: 1px solid #e2e8f0;
        }
    </style>

</head>

<body>

<!-- NAVBAR -->

<nav class="navbar">

    <div class="nav-left">

        <div class="logo">
            Skill<span>upgrade</span>
        </div>

        <button
            onclick="location.href='index.html'"
            class="btn-home">
            🏠 Home
        </button>

    </div>

    <div class="nav-right">

        <label class="theme-switch">
            <input type="checkbox" id="theme-toggle">
            <span class="slider"></span>
        </label>

        <div class="user-profile">
            <span>Welcome, Learner</span>
            <div class="avatar"></div>
        </div>

        <button onclick="logout()" class="btn-logout">Logout</button>

    </div>

</nav>


<!-- MAIN -->

<div class="container">

<!-- INPUT PANEL -->

<aside class="input-panel">

    <h3>Analyze Skills</h3>

    <p style="font-size:0.8rem; opacity:0.7; margin-bottom:20px;">
        Enter your target role to see the gap.
    </p>

    <!-- Job Domain -->
    <div class="input-group">
        <label>Job Domain</label>
        <input
            type="text"
            id="jobTitle"
            placeholder="e.g. Data Scientist">
    </div>

    <!-- Skills -->
    <div class="input-group">
        <label>Your Current Skills</label>
        <textarea
            id="userSkills"
            placeholder="Enter skills (e.g. Python, SQL, HTML)">
        </textarea>
    </div>

    <!-- Difficulty Level -->
    <div class="input-group">
        <label>Difficulty Level</label>
        <select id="difficultyLevel">

            <option value="beginner">Beginner</option>
            <option value="intermediate">Intermediate</option>
            <option value="advanced">Advanced</option>

        </select>
    </div>

    <button onclick="analyzeSkills()" class="btn-analyze">
        Identify Gaps →
    </button>

</aside>


<!-- DASHBOARD -->

<main class="dashboard-content">

<div class="top-row">

    <!-- Chart -->
    <div class="card chart-card">
        <h4>Readiness Score</h4>

        <div class="chart-container">
            <canvas id="progressChart"></canvas>
            <div id="chart-label">0%</div>
        </div>
    </div>

    <!-- Roadmap -->
    <div class="card status-card">
        <h4>🚀 Learning Roadmap</h4>

        <ul id="courseList" class="course-list">
            <li class="empty-msg">
                Enter details to generate your roadmap...
            </li>
        </ul>
    </div>

</div>


<!-- Missing Skills -->
<div class="card gap-card">
    <h4>🔴 Missing Skills</h4>

    <div id="missingSkillsContainer" class="skills-tags">
        <p style="opacity:0.5;">
            Analysis results will appear here...
        </p>
    </div>
</div>


<!-- Existing Skill Recommendations -->
<div class="card gap-card upgrade-section">
    <h4>🟢 Upgrade Your Skills</h4>
    <div id="existingCourses"></div>
</div>


</main>

<script src="js/theme.js"></script>
<script src="js/api.js"></script>
<script src="js/dashboard.js"></script>

</body>
</html>
